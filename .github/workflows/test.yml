name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # No test project runs on CI (see README / PR notes): this job is a build gate.
      # Skip GitVersion: it fails on branches without a full SemVer tag.
      - name: Build
        run: >
          dotnet build TqkLibrary.Gologin.Api/TqkLibrary.Gologin.Api.csproj -c Release
          -p:DisableGitVersionTask=true -p:Version=0.0.0
